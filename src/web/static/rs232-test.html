<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>RS232 테스트</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/diagnostics.css"><script src="/static/rs232-test.js" defer></script></head>
<body><main class="diagnostic-page"><header><div><div class="section-label">SIX CHANNEL LIGHT DIAGNOSTICS</div><h1>RS232 테스트</h1><p>카메라·모델 없이 조명 CH1~CH6의 명령과 ACK를 확인합니다.</p></div><nav><a href="/">검사 화면</a><a href="/camera-test">카메라 테스트</a></nav></header>
  <section class="ui-block"><h2>연결</h2><div class="form-grid"><label>RS232 포트<input id="serial-port" type="text" list="serial-ports"></label><label>전송 속도 (bps)<select id="serial-baud"><option>9600</option><option>19200</option><option>38400</option><option>57600</option><option>115200</option></select></label></div><datalist id="serial-ports"></datalist><div class="button-row"><button id="serial-connect" class="primary">RS232 연결</button><button id="serial-disconnect">RS232 연결 해제</button></div><p id="serial-status" class="info" role="status"></p></section>
  <section class="ui-block"><h2>CH1~CH6 밝기</h2><p>연결과 슬라이더 변경은 밝기 명령을 보내지 않습니다. 적용 버튼을 누르면 순서대로 전송하고 채널마다 ACK를 확인합니다.</p><div id="serial-channels" class="channel-grid"></div><div class="button-row"><button id="serial-apply-all" class="primary">6채널 적용</button><button id="serial-off" class="danger">전체 끄기 · 0%</button></div><p id="serial-message" class="info" role="status"></p></section>
  <section class="ui-block"><div class="history-header"><h2>통신 이력 · 최근 100건</h2><button id="clear-serial-history">이력 지우기</button></div><div class="table-scroll"><table><thead><tr><th>시각</th><th>채널</th><th>설정</th><th>TX</th><th>RX</th><th>결과</th></tr></thead><tbody id="serial-history"></tbody></table></div></section>
</main></body></html>
