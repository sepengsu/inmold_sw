<templates>
  <template id="capture_label"><div class="section-label">CAPTURE <span>CAM-01</span></div></template>
  <template id="lighting_label"><div class="section-label">LIGHTING</div></template>
  <template id="lighting_hint"><div class="hint">4개 조명 · 6채널 연동 제어<br/>면조명 CH1+2 / CH5+6 · 바 조명 CH3 / CH4</div></template>
  <template id="lighting_modal_header"><div class="lighting-modal-header"><div><b>조명 제어</b><span>4 LIGHTS / 6 CHANNELS</span></div><p>적용 버튼을 누르면 해당 조명에 전송합니다. 면조명은 두 채널에 같은 밝기를 적용합니다. 조명값 저장·불러오기는 화면 설정만 처리하며 실제 광량을 읽거나 변경하지 않습니다.</p></div></template>
  <template id="lighting_group_header"><div class="lighting-group-header"><span>LIGHT {number:02d}</span><strong>{fixture_name}</strong><code>{channels}</code><small>{mode}</small></div></template>
  <template id="measurement_info"><div class="section-label">측정 영역</div><div class="measurement-spec"><div><span>P1 · P2 · P3</span><b>256 × 512px</b></div><div><span>가로 중심 간격</span><b>547px</b></div><div><span>세로 위치</span><b>ROI 중앙</b></div></div><div class="hint">측정 결과와 원본·결과 영상은 자동 저장됩니다. History 옆 통계 보기에서 기간별 조회와 CSV 내보내기를 사용할 수 있습니다.</div></template>
  <template id="measurement_info_pce"><div class="section-label">공인인증 측정 영역</div><div class="measurement-spec"><div><span>P1 · P2 · P3</span><b>각 256 × 256px</b></div><div><span>검출 순서</span><b>왼쪽 → 오른쪽</b></div><div><span>점수 분모</span><b>크롭의 검정 제외</b></div></div><div class="hint">어두운 연결 영역이 정확히 3개 검출되어야 합니다. 각 크롭을 256×256 전체로 확대해 따로 추론하고, 원본 크롭에서 검정이 아닌 픽셀만 점수에 사용합니다.</div></template>

  <template id="result_label"><div class="section-label">INSPECTION RESULT <span>LAST RUN</span></div></template>
  <template id="result_initial"><div class="summary"><div class="result-number">--.--<small>%</small></div><div class="result-caption">검사 입력을 선택하고 측정을 시작하세요.</div><div class="result-caption inspection-duration">측정 소요 시간 --</div></div><div class="point-scores"><div class="point-scores-label">P1~P3 함침율</div><div class="metric-list"><div><span>P1</span><b>--.--%</b></div><div><span>P2</span><b>--.--%</b></div><div><span>P3</span><b>--.--%</b></div></div></div></template>
  <template id="history_label"><div class="section-label">HISTORY <span>P1~P3 함침율</span></div></template>
  <template id="result"><div class="summary"><div class="result-number">{average:.2f}<small>%</small></div><div class="result-caption">P1~P3 평균 함침율</div><div class="result-caption">{measurement_detail}</div><div class="result-caption inspection-duration">측정 소요 시간 {duration}</div><div class="result-caption">{timestamp}</div><div class="result-caption">{saved_message}</div></div><div class="point-scores"><div class="point-scores-label">P1~P3 함침율</div><div class="metric-list"><div><span>P1</span><b>{p1:.2f}%</b></div><div><span>P2</span><b>{p2:.2f}%</b></div><div><span>P3</span><b>{p3:.2f}%</b></div></div></div></template>
  <template id="history_list"><div class="history-list"><div class="history-head"><span>NO</span><span>P1</span><span>P2</span><span>P3</span></div>{rows}</div></template>
  <template id="history_row"><div class="history-entry" title="{timestamp} · {source} · 소요 시간 {duration}"><div class="history-row"><span class="history-index">{position}</span><b>{p1:.2f}%</b><b>{p2:.2f}%</b><b>{p3:.2f}%</b></div><div class="history-meta"><span>{source}</span><span>{mode}</span><span>{saved}</span><span class="history-duration">소요 시간 {duration}</span><time>{timestamp}</time></div></div></template>
  <template id="history_empty_row"><div class="history-row is-empty"><span class="history-index">{position}</span><b>--.--%</b><b>--.--%</b><b>--.--%</b></div></template>
  <template id="head"><meta name="color-scheme" content="dark"/><style>html, body {{ margin:0; }} @media (min-width:1000px) {{ html, body {{ height:100dvh; overflow:hidden; }} }} @media (max-width:999px) {{ html, body {{ height:auto; overflow:auto; }} }}</style></template>
</templates>
